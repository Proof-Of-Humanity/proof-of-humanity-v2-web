overwrite: true
schema: "${ATLAS_URL}/graphql"
documents: "schemas/atlas/**/*.gql"
generates:
  ./src/generated/atlas.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-graphql-request"
    config:
      scalars:
        Address: string
      useTypeImports: true
      onlyOperationTypes: true
