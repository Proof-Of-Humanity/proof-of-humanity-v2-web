fragment winnerClaim on Humanity {
  winnerClaim: requests(
    where: {
      revocation: false
      winnerParty: "requester"
      status_in: ["resolved", "transferred"]
      evidenceGroup_: { length_gt: 0 }
    }
    first: 1
    orderBy: lastStatusChange
    orderDirection: desc
  ) {
    claimer {
      id
      name
    }
    creationTime
    index
    lastStatusChange
    requester
    resolutionTime
    evidenceGroup {
      evidence(orderBy: creationTime, orderDirection: asc, first: 1) {
        uri
      }
    }
  }
}
