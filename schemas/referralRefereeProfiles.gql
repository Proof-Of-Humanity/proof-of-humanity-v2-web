query ReferralRefereeProfiles($ids: [Bytes!]) {
  humanities(where: { id_in: $ids }, first: 100) {
    id
    pendingRevocation
    registration {
      expirationTime
      claimer {
        name
      }
    }
    latestRemovalRequest: requests(
      first: 1
      orderBy: creationTime
      orderDirection: desc
      where: {
        revocation: true
        status: "resolved"
        winnerParty_: { id: "requester" }
      }
    ) {
      creationTime
    }
    latestClaimRequest: requests(
      first: 1
      orderBy: creationTime
      orderDirection: desc
      where: { revocation: false }
    ) {
      creationTime
      status {
        id
      }
      winnerParty {
        id
      }
      claimer {
        name
      }
      evidenceGroup {
        evidence(first: 1, orderBy: creationTime, orderDirection: desc) {
          uri
        }
      }
    }
  }
}
